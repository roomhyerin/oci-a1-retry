name: OCI A1 retry
on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  actions: write              # 성공 시 스스로 끄기 위해 필요

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=ap-tokyo-1
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Apply stack
        id: apply
        run: |
          STATE=$(oci resource-manager job create-apply-job \
            --stack-id "${{ secrets.STACK_ID }}" \
            --execution-plan-strategy AUTO_APPROVED \
            --wait-for-state SUCCEEDED --wait-for-state FAILED \
            --query 'data."lifecycle-state"' --raw-output)
          echo "결과: $STATE"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Disable workflow on success
        if: steps.apply.outputs.state == 'SUCCEEDED'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
